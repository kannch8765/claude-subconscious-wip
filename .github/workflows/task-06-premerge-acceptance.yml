name: task-06 premerge acceptance

on:
  push:
    branches:
      - task/06-schema-derived-memory-tools

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Acceptance regressions
        run: npx vitest run scripts/task06_premerge_acceptance.test.ts
      - name: Validator differential against task baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline_root="$(mktemp -d)"
          baseline_dir="$baseline_root/baseline"
          cleanup() { git worktree remove --force "$baseline_dir" >/dev/null 2>&1 || true; rm -rf "$baseline_root"; }
          trap cleanup EXIT
          git worktree add --detach "$baseline_dir" 57f5ba9998419642b70c35167b5f6aadb05bef8d >/dev/null
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_dir/node_modules"
          cat > "$RUNNER_TEMP/task06-validator-probe.ts" <<'TS'
          import * as path from 'node:path';
          import { pathToFileURL } from 'node:url';
          async function main() {
            const root = process.argv[2];
            const schema = await import(pathToFileURL(path.join(root, 'relationship-memory/src/schema/index.ts')).href);
            const base = {
            schema_version: 1,
            summary: '猫明确表达了一项稳定信息。',
            participants: ['user'],
            evidence_message_ids: ['message-evidence'],
          };
          const valid = {
            personal_experience: { ...base, kind: 'personal_experience', payload: { title: '一次对话', experience: '猫明确说自己偏好安静的咖啡店。', themes: ['咖啡'] } },
            shared_experience: { ...base, kind: 'shared_experience', participants: ['user', 'assistant'], payload: { title: '一起讨论咖啡店', event: '猫和琥珀讨论咖啡店。', shared_meaning: '讨论如何选择更安静的店。', symbols: ['咖啡'] } },
            relationship_event: { ...base, kind: 'relationship_event', participants: ['user', 'assistant'], payload: { event: '猫向琥珀说明偏好。', meaning: '琥珀获得明确偏好信息。', prior_context: '讨论选店。' } },
            inside_joke: { ...base, kind: 'inside_joke', participants: ['user', 'assistant'], payload: { name: '安静咖啡店', meaning: '固定说法。', trigger_phrases: ['安静咖啡店'], callbacks: ['选安静的'] } },
            user_preference: { ...base, kind: 'user_preference', payload: { topic: '咖啡店环境', preference: '猫偏好安静的咖啡店。', context: '选店时。' } },
          };
          const fixtures = [
            ...Object.values(valid),
            { ...valid.relationship_event, payload: { event: '事件', meaning: '含义', emotional_tone: 'wrong kind' } },
            { ...valid.relationship_event, payload: { event: '事件' } },
            { ...valid.relationship_event, payload: { event: '事件', meaning: '含义', prior_context: null } },
            { ...valid.inside_joke, payload: { name: '梗', meaning: '含义', trigger_phrases: [] } },
            { ...valid.personal_experience, payload: { title: '标题', experience: '经历', themes: ['咖啡', '咖啡'] } },
            { ...valid.personal_experience, participants: ['user', 'user'] },
            { ...valid.personal_experience, unexpected: true },
            { ...valid.personal_experience, subject_id: 'forbidden' },
          ];
            const results = fixtures.map((fixture) => schema.validateProposal(fixture));
            process.stdout.write(JSON.stringify(results, null, 2) + '\n');
          }
          void main();
          TS
          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" "$RUNNER_TEMP/task06-validator-probe.ts" "$baseline_dir" > "$RUNNER_TEMP/task06-validator-baseline.json"
          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" "$RUNNER_TEMP/task06-validator-probe.ts" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/task06-validator-current.json"
          diff -u "$RUNNER_TEMP/task06-validator-baseline.json" "$RUNNER_TEMP/task06-validator-current.json"
          echo "validator differential: exact match"
      - name: Explicit TypeScript baseline comparison
        shell: bash
        run: |
          set -euo pipefail
          baseline_root="$(mktemp -d)"
          baseline_dir="$baseline_root/baseline"
          baseline_log="$RUNNER_TEMP/task06-tsc-baseline.log"
          current_log="$RUNNER_TEMP/task06-tsc-current.log"
          cleanup() { git worktree remove --force "$baseline_dir" >/dev/null 2>&1 || true; rm -rf "$baseline_root"; }
          trap cleanup EXIT
          git worktree add --detach "$baseline_dir" 57f5ba9998419642b70c35167b5f6aadb05bef8d >/dev/null
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_dir/node_modules"
          tsc="$GITHUB_WORKSPACE/node_modules/.bin/tsc"
          common=(
            --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext
            --types node,vitest/globals --skipLibCheck
            relationship-memory/src/schema/index.ts
            relationship-memory/src/tools/index.ts
            relationship-memory/src/adapter/index.ts
            scripts/relationship_observer_runner.ts
            scripts/send_worker_native.ts
            relationship-memory/tests/relationship-memory.test.ts
            scripts/relationship_observer_runner.test.ts
            scripts/live_async_memory_surfacing.test.ts
            scripts/sync_subcon_mode.test.ts
            scripts/relationship_memory_backfill_runner.test.ts
          )
          (cd "$baseline_dir" && "$tsc" "${common[@]}" >"$baseline_log" 2>&1 || true)
          ("$tsc" "${common[@]}" scripts/task06_premerge_acceptance.test.ts >"$current_log" 2>&1 || true)
          python - "$baseline_log" "$current_log" <<'PY'
          from pathlib import Path
          import sys
          def diagnostics(path):
              return {line.strip() for line in Path(path).read_text().splitlines() if 'error TS' in line}
          baseline = diagnostics(sys.argv[1])
          current = diagnostics(sys.argv[2])
          new = sorted(current - baseline)
          print(f'baseline TypeScript diagnostics: {len(baseline)}')
          print(f'current TypeScript diagnostics: {len(current)}')
          if new:
              print('new TypeScript diagnostics:')
              print('\n'.join(new))
              raise SystemExit(1)
          print('TypeScript check: no new diagnostics versus baseline')
          if len(baseline) != 3 or len(current) != 3:
              raise SystemExit('expected the known 3 baseline diagnostics only')
          PY
      - name: Diff hygiene
        run: git diff --check 57f5ba9998419642b70c35167b5f6aadb05bef8d...HEAD
