name: task-06 schema-derived memory tools

on:
  push:
    branches:
      - task/06-schema-derived-memory-tools

permissions:
  contents: write

jobs:
  apply-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply task 06 implementation
        run: python scripts/task_06_prepatch.py && python scripts/task_06_apply.py
      - name: Install dependencies
        run: npm ci
      - name: Targeted regression suite
        run: >-
          npx vitest run
          relationship-memory/tests/relationship-memory.test.ts
          scripts/relationship_observer_runner.test.ts
          scripts/live_async_memory_surfacing.test.ts
          scripts/sync_subcon_mode.test.ts
          scripts/relationship_memory_backfill_runner.test.ts
          scripts/backfill_agent_config.test.ts
          scripts/managed_system_prompt.test.ts
      - name: Full test suite
        run: npm test
      - name: Explicit TypeScript check
        shell: bash
        run: |
          set -euo pipefail
          baseline_root="$(mktemp -d)"
          baseline_dir="$baseline_root/baseline"
          baseline_log="$RUNNER_TEMP/task06-tsc-baseline.log"
          current_log="$RUNNER_TEMP/task06-tsc-current.log"
          cleanup() { git worktree remove --force "$baseline_dir" >/dev/null 2>&1 || true; rm -rf "$baseline_root"; }
          trap cleanup EXIT
          git worktree add --detach "$baseline_dir" 57f5ba9998419642b70c35167b5f6aadb05bef8d >/dev/null
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_dir/node_modules"
          tsc="$GITHUB_WORKSPACE/node_modules/.bin/tsc"
          args=(
            --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext
            --types node,vitest/globals --skipLibCheck
            relationship-memory/src/schema/index.ts
            relationship-memory/src/tools/index.ts
            relationship-memory/src/adapter/index.ts
            scripts/relationship_observer_runner.ts
            scripts/send_worker_native.ts
            relationship-memory/tests/relationship-memory.test.ts
            scripts/relationship_observer_runner.test.ts
            scripts/live_async_memory_surfacing.test.ts
            scripts/sync_subcon_mode.test.ts
            scripts/relationship_memory_backfill_runner.test.ts
          )
          (cd "$baseline_dir" && "$tsc" "${args[@]}" >"$baseline_log" 2>&1 || true)
          ("$tsc" "${args[@]}" >"$current_log" 2>&1 || true)
          python - "$baseline_log" "$current_log" <<'PY'
          from pathlib import Path
          import sys
          def diagnostics(path):
              return {line.strip() for line in Path(path).read_text().splitlines() if 'error TS' in line}
          baseline = diagnostics(sys.argv[1])
          current = diagnostics(sys.argv[2])
          new = sorted(current - baseline)
          print(f'baseline TypeScript diagnostics: {len(baseline)}')
          print(f'current TypeScript diagnostics: {len(current)}')
          if new:
              print('new TypeScript diagnostics:')
              print('\n'.join(new))
              raise SystemExit(1)
          print('TypeScript check: no new diagnostics versus baseline')
          PY
      - name: Write implementation report
        shell: bash
        run: |
          cat > docs/IMPLEMENTATION-06-MEMORY-WRITE-TOOLS.md <<'EOF'
          # Implementation 06 — Schema-derived memory creation tools

          本轮把模型侧统一 `memory_remember` 收敛为五个 kind-specific create tool：`memory_remember_personal_experience`、`memory_remember_shared_experience`、`memory_remember_relationship_event`、`memory_remember_inside_joke`、`memory_remember_user_preference`。kind 不再由模型传入；各工具只暴露该 kind 的 payload 字段，required / string / string-array / non-empty-array 约束均从 `MEMORY_KIND_DEFINITIONS` 生成，canonical validator 也读取同一份定义，避免字段表双写漂移。薄 dispatcher 仅补 `schema_version: 1` 与固定 kind，随后继续走原 `runtime.remember()`，因此 evidence/subject/batch 绑定、source_key/dedupe、锁、outcome、checkpoint 与错误恢复保持原路径。

          tool catalog 由 `MEMORY_KINDS` 生成五个名称、schema、注册和 mutation 分类；sync 权限仍是显式 `memory_search + entity_search` allowlist，不会因新增 kind 自动获得写权限。live async 与 historical backfill 都从同一 catalog 取工具，旧 standalone `memory_remember` 不再同 turn 暴露；#79 的 `config/live-system.md` / `config/backfill-system.md`、两份 AgentFile system/bootstrap 与 live `tool_guidelines` 已同步。final native client-tool 回归同时检查 live 与 backfill 的实际 parameters，锁住 `relationship_event` 不得出现 `emotional_tone/why_memorable`。

          迁移沿用现有恢复边界：native continuation 每次请求都重带当前 `client_tools`；clean paused backfill 可保留 checkpoint/conversation 继续，只有 `retryable_batch` 才在重试前旋转 conversation。live 旧 pending/失败调用仍由既有 retry-rotation marker 处理，因此没有新增无条件 rotation、agent rebind 或 batch replay。

          验证：targeted Vitest（relationship-memory、native backfill/live、sync、runner、managed prompt）、完整 `npm test` 均通过；ES2022 + NodeNext + `node,vitest/globals` 的显式 `tsc --noEmit` 与基准对照无新增诊断，基准既有诊断未扩修；另执行 `git diff --check`。未登录 VPS、未读取/修改 production canonical store、未调用真实 Letta/模型/embedding，也未 merge/deploy。
          EOF
      - name: Commit verified implementation
        shell: bash
        run: |
          rm scripts/task_06_apply.py scripts/task_06_prepatch.py .github/workflows/task-06-apply.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Implement schema-derived memory creation tools'
          git push origin HEAD:task/06-schema-derived-memory-tools
