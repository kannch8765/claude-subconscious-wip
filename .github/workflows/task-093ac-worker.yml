name: task-093ac-worker
on:
  push:
    branches:
      - task/093ac-subcon-canonical-af-runtime-config-reconciliation
permissions:
  contents: write
jobs:
  implement-and-test:
    if: "${{ github.event.head_commit.message != 'task 093ac: reconcile canonical managed runtime config' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/093ac-subcon-canonical-af-runtime-config-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply 093AC implementation
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/task_093ac_worker.py
          python /tmp/task_093ac_worker.py
          node -e "JSON.parse(require('fs').readFileSync('Subconscious.af','utf8'))"
      - name: Focused tests
        run: npm test -- --run scripts/managed_runtime_config.test.ts scripts/backfill_agent_config.test.ts scripts/agent_config.test.ts
      - name: Full test suite
        run: npm test
      - name: Commit implementation
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/task-093ac-worker.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "task 093ac: reconcile canonical managed runtime config"
          git push origin HEAD:task/093ac-subcon-canonical-af-runtime-config-reconciliation
