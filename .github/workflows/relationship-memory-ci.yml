name: Task 093U R1 correction runner

on:
  push:
    branches:
      - ci/relationship-memory-01

permissions:
  contents: write

concurrency:
  group: relationship-memory-093u-r1-correction
  cancel-in-progress: false

jobs:
  correct-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: 9ae170475d7c7194972169ba1553f1e97cbdd659
      TARGET_BRANCH: task/093u-relationship-memory-transcript-event-evidence-foundation
    steps:
      - name: Checkout isolated CI runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/task-093u-r1.patch.gz.b64 | gzip -d > /tmp/093u-r1.patch
          test "$(git ls-remote origin refs/heads/${TARGET_BRANCH} | cut -f1)" = "${BASE_SHA}"
          git checkout --detach "${BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          git apply --check -p1 /tmp/093u-r1.patch
          git apply -p1 /tmp/093u-r1.patch
          git diff --check

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: Run full repository tests before publication
        run: npm test

      - name: Create clean R1 correction commit and fast-forward task branch
        shell: bash
        run: |
          set -euo pipefail
          git add relationship-memory/src/tools/index.ts relationship-memory/tests/relationship-memory.test.ts relationship-memory/tests/semantic-context.test.ts relationship-memory/tests/transcript-event-evidence.test.ts
          git config user.name "Sou"
          git config user.email "105340539+kannch8765@users.noreply.github.com"
          git commit -m "task 093u: address reviewer R1"
          echo "R1_HEAD=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/${TARGET_BRANCH}
