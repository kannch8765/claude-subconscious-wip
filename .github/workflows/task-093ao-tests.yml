name: Task 093AO tests

on:
  push:
    branches:
      - task/093ao-historical-dariotouch-pair-stripe
  pull_request:
    branches: [main]
    paths:
      - 'relationship-memory/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/task-093ao-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
