name: Task 093W exact-head gate

on:
  push:
    branches:
      - task/093w-dedicated-backfill-agent-concurrent-writer-safety

permissions:
  contents: write

jobs:
  exact-head-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Narrow agent config back to frozen 093V
        run: |
          git show e93706d1bb1a38dceaaf34131bff26aafa922e85:scripts/agent_config.ts > scripts/agent_config.ts
          git rm .github/workflows/task-093w-ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/agent_config.ts
          git commit -m "Task 093W: narrow dedicated resolver boundary"
      - run: npm ci
      - run: npm test
      - name: Publish only the tested exact commit
        run: git push origin HEAD:task/093w-dedicated-backfill-agent-concurrent-writer-safety
