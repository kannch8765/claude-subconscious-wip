name: PR offline CI

on:
  # Run the same offline gate on normal and stacked PRs, including Drafts.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  offline-ci:
    name: offline-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run typecheck
