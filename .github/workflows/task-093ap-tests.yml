name: Task 093AP tests

on:
  push:
    branches:
      - task/093ap-concurrent-writer-lock-contention-test-stability
  pull_request:
    branches: [main]
    paths:
      - 'relationship-memory/src/store/**'
      - 'relationship-memory/tests/concurrent-writer-safety.test.ts'
      - 'relationship-memory/tests/concurrent-writer-child.ts'
      - '.github/workflows/task-093ap-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Stress lock contention case
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            echo "contention stress run ${i}/20"
            npx vitest run relationship-memory/tests/concurrent-writer-safety.test.ts \
              -t 'surfaces lock contention as an explicit retryable failure'
          done
      - name: Full test suite
        run: npm run test:ci
